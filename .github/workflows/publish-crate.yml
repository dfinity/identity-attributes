name: publish on crates.io

on:
  workflow_dispatch:
  push:
    tags:
      - rust-v*.*.*

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: the crates.io token is minted per run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # crates.io trusts this repository, this workflow file, and the `release`
      # environment (each crate -> Settings -> Trusted Publishing).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # The macros first: `identity-attributes` depends on them by exact version.
      - run: cargo publish --locked -p identity-attributes-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish --locked -p identity-attributes
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
